<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SpaceCraft — Донат</title>
<style>
  :root{
    --bg:#0a0e1f; --bg2:#0e1330; --card:#131a3a; --accent:#7c5cff; --accent2:#4fd1ff;
    --text:#eef0ff; --muted:#8a90b8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Segoe UI', Roboto, Arial, sans-serif;
    background:var(--bg); color:var(--text);
    background-image:
      radial-gradient(2px 2px at 20px 30px, #fff, transparent),
      radial-gradient(2px 2px at 140px 90px, #fff, transparent),
      radial-gradient(1.5px 1.5px at 300px 40px, #cfd4ff, transparent),
      radial-gradient(1.5px 1.5px at 420px 120px, #fff, transparent),
      radial-gradient(2px 2px at 550px 60px, #cfd4ff, transparent),
      radial-gradient(1.5px 1.5px at 700px 150px, #fff, transparent),
      radial-gradient(2px 2px at 90px 220px, #fff, transparent),
      radial-gradient(1.5px 1.5px at 250px 280px, #cfd4ff, transparent),
      radial-gradient(1.5px 1.5px at 480px 260px, #fff, transparent);
    background-repeat:repeat; background-size:750px 350px;
  }

  header{
    display:flex; justify-content:space-between; align-items:center;
    padding:16px 40px; background:rgba(14,19,48,0.7); backdrop-filter:blur(6px);
  }
  .logo{font-weight:bold; font-size:1.3em; letter-spacing:1px; color:var(--accent2);}
  nav a{color:var(--muted); text-decoration:none; margin:0 16px; font-size:.95em;}
  .cart-btn{
    background:linear-gradient(90deg,var(--accent),var(--accent2)); border:none;
    color:#fff; font-weight:bold; padding:10px 18px; border-radius:10px; cursor:pointer;
  }

  .hero{
    text-align:center; padding:90px 20px 60px;
  }
  .hero h1{
    font-size:3em; margin:0; letter-spacing:2px;
    background:linear-gradient(90deg,var(--accent2),var(--accent));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .hero p{color:var(--muted); max-width:500px; margin:14px auto 0;}
  .online{color:var(--muted); margin-top:18px; font-size:.9em;}
  .online span{color:#4ade80;}

  .shop-title{max-width:900px; margin:0 auto 20px; padding:0 20px;}
  .shop-title h2{border-bottom:2px solid var(--accent); display:inline-block; padding-bottom:6px;}

  .grid{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
    gap:18px; max-width:900px; margin:0 auto 50px; padding:0 20px;
  }
  .item{
    background:var(--card); border-radius:14px; padding:20px; text-align:center;
    border:1px solid rgba(124,92,255,0.25);
  }
  .item h3{margin:6px 0;}
  .item .price{color:var(--accent2); font-weight:bold; font-size:1.15em; margin-bottom:12px;}
  .item button{
    background:linear-gradient(90deg,var(--accent),var(--accent2)); border:none; color:#fff;
    font-weight:bold; padding:10px 16px; border-radius:8px; cursor:pointer; width:100%;
  }
  .item button:hover{opacity:0.9;}

  .cart{
    max-width:480px; margin:0 auto 60px; background:var(--card); border-radius:14px;
    padding:22px; border:1px solid rgba(124,92,255,0.25);
  }
  .cart h2{margin-top:0;}
  .cart-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:8px 0; border-bottom:1px solid rgba(255,255,255,0.08);
  }
  .cart-row button{background:none; border:none; color:#ff6b6b; cursor:pointer; font-size:1em;}
  .total{display:flex; justify-content:space-between; font-weight:bold; margin-top:12px; font-size:1.2em;}
  input[type=text]{
    width:100%; padding:10px; margin-top:16px; border-radius:8px;
    border:1px solid rgba(124,92,255,0.4); background:#0d1230; color:var(--text);
  }
  .checkout{
    width:100%; margin-top:16px; padding:14px; border:none; border-radius:8px;
    font-weight:bold; font-size:1.05em; cursor:pointer; color:#fff;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
  }
  .checkout:disabled{opacity:0.35; cursor:not-allowed;}
  .empty{color:var(--muted); text-align:center; padding:16px 0;}
</style>
</head>
<body>

<header>
  <div class="logo">✦ SPACECRAFT</div>
  <nav>
    <a href="#">Онлайн карта</a>
    <a href="#">Вики сервера</a>
    <a href="#">Помощь</a>
  </nav>
  <button class="cart-btn">🛒 0.00 ₽</button>
</header>

<div class="hero">
  <h1>SPACECRAFT</h1>
  <p>Тестовая страница доната в космической теме — просто пример оформления.</p>
  <div class="online">Онлайн на сервере: <span>37 из 150</span></div>
</div>

<div class="shop-title"><h2>Наши товары</h2></div>

<div class="grid" id="shop"></div>

<div class="cart">
  <h2>Корзина</h2>
  <div id="cartItems"><p class="empty">Корзина пуста</p></div>
  <div class="total"><span>Итого:</span><span id="totalPrice">0 ₽</span></div>
  <input type="text" id="nickname" placeholder="Твой ник на сервере">
  <button class="checkout" id="checkoutBtn" disabled>Оформить донат</button>
</div>

<script>
  // ====== НАСТРОЙКИ — ЗАМЕНИ НА СВОИ ======
  const DONATIONALERTS_USERNAME = "твой_ник_на_da";
  const products = [
    { id: 1, name: "Звёздный VIP", price: 199 },
    { id: 2, name: "Набор астероидов", price: 49 },
  ];
  // ==========================================

  let cart = [];

  function renderShop(){
    document.getElementById('shop').innerHTML = products.map(p => `
      <div class="item">
        <h3>${p.name}</h3>
        <div class="price">${p.price} ₽</div>
        <button onclick="addToCart(${p.id})">В корзину</button>
      </div>
    `).join('');
  }

  function addToCart(id){
    cart.push(products.find(p => p.id === id));
    renderCart();
  }

  function removeFromCart(index){
    cart.splice(index, 1);
    renderCart();
  }

  function renderCart(){
    const container = document.getElementById('cartItems');
    const checkoutBtn = document.getElementById('checkoutBtn');

    if(cart.length === 0){
      container.innerHTML = '<p class="empty">Корзина пуста</p>';
      checkoutBtn.disabled = true;
    } else {
      container.innerHTML = cart.map((item, i) => `
        <div class="cart-row">
          <span>${item.name} — ${item.price} ₽</span>
          <button onclick="removeFromCart(${i})">✕</button>
        </div>
      `).join('');
      checkoutBtn.disabled = false;
    }

    const total = cart.reduce((sum, i) => sum + i.price, 0);
    document.getElementById('totalPrice').textContent = total + ' ₽';
  }

  document.getElementById('checkoutBtn').addEventListener('click', () => {
    const nickname = document.getElementById('nickname').value.trim();
    if(!nickname){ alert('Введи свой ник на сервере!'); return; }

    const total = cart.reduce((sum, i) => sum + i.price, 0);
    const itemsList = cart.map(i => i.name).join(', ');
    const message = `Ник: ${nickname} | Товары: ${itemsList}`;
    const url = `https://www.donationalerts.com/r/${DONATIONALERTS_USERNAME}` +
      `?amount=${total}&message=${encodeURIComponent(message)}`;

    window.location.href = url;
  });

  renderShop();
  renderCart();
</script>

</body>
</html>
